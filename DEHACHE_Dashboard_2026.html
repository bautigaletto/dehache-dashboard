<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DEHACHE · Panel de Ventas 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#01216A; --navy2:#0A2E80; --navy-d:#021545;
  --red:#B11425; --red2:#D43146;
  --ink:#0f182b; --muted:#5b6b86; --muted2:#8a97ad;
  --line:#e4e8f0; --line2:#eef1f6; --bg:#eaeef4; --card:#ffffff;
  --ok:#1f8a5b; --amber:#E0982B;
  --sh:0 1px 2px rgba(15,24,43,.06),0 8px 24px rgba(15,24,43,.06);
  --sh2:0 12px 40px rgba(2,21,69,.18);
  --r:16px; --r2:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:78px}
h1,h2,h3{margin:0;font-family:Oswald,sans-serif;font-weight:600;letter-spacing:.2px}
.num{font-family:Oswald,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.3px}
button{font-family:inherit;cursor:pointer;border:none;background:none}
select,input{font-family:inherit;font-size:14px}
::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-thumb{background:#c4ccda;border-radius:8px}

/* ---------- HEADER ---------- */
.hdr{position:sticky;top:0;z-index:60;background:linear-gradient(120deg,var(--navy-d),var(--navy) 55%,var(--navy2));
  color:#fff;padding:10px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 4px 20px rgba(2,21,69,.3)}
.logoPill{background:#fff;border-radius:12px;padding:6px 10px;display:flex;align-items:center;height:46px;flex:none}
.logoPill img{height:34px;display:block}
.hdr .tt{display:flex;flex-direction:column;line-height:1.05}
.hdr .tt b{font-family:Oswald,sans-serif;font-weight:600;font-size:18px;letter-spacing:.4px}
.hdr .tt span{font-size:11px;color:#aebbe0;letter-spacing:.5px;text-transform:uppercase}
.hdr .spacer{flex:1}
.hdr .note{font-size:11px;color:#aebbe0;text-align:right;line-height:1.3}
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.1);padding:4px;border-radius:12px}
.tabs button{color:#cdd7f0;padding:8px 16px;border-radius:9px;font-weight:600;font-size:13px;transition:.18s}
.tabs button.on{background:#fff;color:var(--navy)}
.tabs button:not(.on):hover{color:#fff}

/* ---------- CONTROL BAR ---------- */
.ctrl{position:sticky;top:66px;z-index:55;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.periods{display:flex;gap:5px;overflow-x:auto;flex:none;padding-bottom:2px}
.periods button{padding:7px 13px;border-radius:20px;font-weight:600;font-size:12.5px;color:var(--muted);
  background:var(--line2);border:1px solid transparent;white-space:nowrap;transition:.15s}
.periods button.on{background:var(--navy);color:#fff}
.periods button:not(.on):hover{background:#e2e7f1}
.fgroup{display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex:1;min-width:0}
.sel{position:relative}
.sel select{appearance:none;-webkit-appearance:none;background:#fff;border:1.5px solid var(--line);
  border-radius:10px;padding:8px 30px 8px 12px;color:var(--ink);font-weight:500;max-width:200px;cursor:pointer;transition:.15s}
.sel select:focus{outline:none;border-color:var(--navy)}
.sel.active select{border-color:var(--navy);background:#f4f7ff;font-weight:600;color:var(--navy)}
.sel::after{content:"▾";position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:11px}
.search{position:relative;flex:none}
.search input{width:210px;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px 8px 34px;color:var(--ink)}
.search input:focus{outline:none;border-color:var(--navy)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted2)}
.search .res{position:absolute;top:44px;left:0;width:340px;max-width:88vw;background:#fff;border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--sh2);max-height:360px;overflow:auto;z-index:70;display:none}
.search .res.show{display:block}
.res .ri{padding:10px 13px;border-bottom:1px solid var(--line2);cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}
.res .ri:hover{background:#f4f7ff}
.res .ri .rn{font-size:12.5px;font-weight:500;line-height:1.25}
.res .ri .rv{font-family:Oswald,sans-serif;color:var(--navy);font-weight:600;white-space:nowrap}
.res .empty{padding:16px;color:var(--muted);text-align:center;font-size:13px}
.btn-clear{font-size:12px;color:var(--red);font-weight:600;padding:6px 8px;border-radius:8px}
.btn-clear:hover{background:#fdeaec}

/* ---------- LAYOUT ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 30px}
.sec{margin-bottom:20px}
.sec-h{display:flex;align-items:center;gap:10px;margin:0 0 12px 2px}
.sec-h h2{font-size:17px;color:var(--ink);text-transform:uppercase;letter-spacing:.6px}
.sec-h .bar{width:4px;height:18px;background:var(--red);border-radius:3px}
.sec-h .sub{font-size:12px;color:var(--muted);font-weight:500;margin-left:auto;font-family:Inter}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(158px,1fr))}
.cols2{grid-template-columns:1fr 1fr}
.cols-hero{grid-template-columns:320px 1fr}

/* KPI cards */
.kpi{background:var(--card);border-radius:var(--r2);box-shadow:var(--sh);padding:15px 16px;position:relative;overflow:hidden}
.kpi .lab{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.kpi .val{font-family:Oswald,sans-serif;font-size:27px;font-weight:600;margin-top:4px;line-height:1;color:var(--ink)}
.kpi .sub{font-size:11.5px;color:var(--muted);margin-top:5px}
.kpi .accent{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--navy)}
.kpi.red .accent{background:var(--red)}
.kpi .ic{position:absolute;right:12px;top:12px;opacity:.12;font-size:30px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px}
.tag.up{background:#e6f4ee;color:var(--ok)} .tag.dn{background:#fdeaec;color:var(--red)}

/* hero gauge */
.hero{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.ring{position:relative;width:210px;height:210px;border-radius:50%;display:grid;place-items:center}
.ring .hole{position:absolute;inset:20px;background:#fff;border-radius:50%;display:flex;flex-direction:column;
  align-items:center;justify-content:center}
.ring .pc{font-family:Oswald,sans-serif;font-size:42px;font-weight:700;line-height:1}
.ring .pl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:600}
.hero .h-val{font-family:Oswald,sans-serif;font-size:30px;font-weight:600}
.hero .h-tgt{font-size:12.5px;color:var(--muted)}
.hero .h-gap{font-size:12.5px;font-weight:600;margin-top:2px}

/* break-even bars */
.bes{display:flex;flex-direction:column;gap:11px}
.be{cursor:pointer;border-radius:10px;padding:3px 2px;transition:.12s}
.be:hover{background:#f6f8fc}
.be.sel{background:#eef3ff;outline:1.5px solid #c9d6f5}
.be .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;gap:8px}
.be .nm{font-weight:600;font-size:13px}
.be .vals{font-size:11.5px;color:var(--muted);white-space:nowrap}
.be .vals b{color:var(--ink);font-family:Oswald;font-weight:600;font-size:13px}
.be .track{height:13px;background:var(--line2);border-radius:8px;position:relative;overflow:hidden}
.be .fill{height:100%;border-radius:8px;transition:width .5s cubic-bezier(.4,1.2,.5,1)}
.be .pct{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:10px;font-weight:700;color:#fff;font-family:Oswald}
.be .pct.out{right:auto;left:calc(100% + 6px);color:var(--ink);transform:translateY(-50%)}

/* generic ranked bars */
.rk{display:flex;flex-direction:column;gap:10px}
.rk .row{cursor:pointer;transition:.12s}
.rk .row:hover .lbl b{color:var(--navy)}
.rk .lbl{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;gap:8px}
.rk .lbl b{font-weight:600}
.rk .lbl span{color:var(--muted);font-family:Oswald;font-weight:600}
.rk .tr{height:11px;background:var(--line2);border-radius:7px;overflow:hidden}
.rk .fl{height:100%;border-radius:7px;background:linear-gradient(90deg,var(--navy),var(--navy2));transition:width .5s}
.rk .row:hover .fl{filter:brightness(1.12)}

/* donut + legend */
.mix{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.mix svg{flex:none}
.leg{display:flex;flex-direction:column;gap:7px;flex:1;min-width:160px}
.leg .li{display:flex;align-items:center;gap:8px;font-size:12.5px}
.leg .dot{width:11px;height:11px;border-radius:3px;flex:none}
.leg .ln{flex:1;font-weight:500}
.leg .lv{font-family:Oswald;font-weight:600;color:var(--muted)}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;
  padding:8px 10px;border-bottom:2px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid var(--line2)}
.tbl tr{cursor:pointer}
.tbl tbody tr:hover{background:#f6f8fc}
.tbl .r{text-align:right;font-family:Oswald;font-weight:600;font-variant-numeric:tabular-nums}
.tbl .rk0{width:26px;color:var(--muted);font-family:Oswald;font-weight:600}

/* chips (vendor selector) */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{padding:8px 14px;border-radius:22px;background:#fff;border:1.5px solid var(--line);
  font-weight:600;font-size:13px;color:var(--ink);transition:.15s}
.chips button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chips button:not(.on):hover{border-color:var(--navy);color:var(--navy)}

/* client accordion (zonas) */
.cl{display:flex;flex-direction:column;gap:8px}
.cl .ci{border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:.15s}
.cl .ci.open{border-color:#c9d6f5;box-shadow:0 6px 18px rgba(2,21,69,.08)}
.cl .ch{display:flex;align-items:center;gap:11px;padding:12px 14px;cursor:pointer}
.cl .ch:hover{background:#f6f8fc}
.cl .av{width:34px;height:34px;border-radius:9px;background:var(--navy);color:#fff;display:grid;place-items:center;
  font-family:Oswald;font-weight:600;font-size:13px;flex:none}
.cl .ci:nth-child(even) .av{background:var(--red)}
.cl .cn{flex:1;min-width:0}
.cl .cn b{font-weight:600;font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl .cn small{color:var(--muted);font-size:11.5px}
.cl .cv{text-align:right;flex:none}
.cl .cv b{font-family:Oswald;font-weight:600;font-size:15px;display:block}
.cl .cv small{color:var(--muted);font-size:11px}
.cl .car{color:var(--muted2);transition:.2s;flex:none}
.cl .ci.open .car{transform:rotate(180deg);color:var(--navy)}
.cl .body{display:none;padding:0 14px 14px;border-top:1px solid var(--line2)}
.cl .ci.open .body{display:block}
.cl .body .mh{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin:12px 0 9px}

/* trend */
.trend svg{width:100%;height:auto;display:block;overflow:visible}

/* empty / hint */
.hint{background:#f4f7ff;border:1px dashed #c9d6f5;border-radius:12px;padding:16px;color:var(--navy);
  font-size:13px;display:flex;gap:10px;align-items:center}
.hint b{font-weight:700}

/* bottom nav (mobile) */
.bnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;background:#fff;
  border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));justify-content:space-around;
  box-shadow:0 -4px 20px rgba(15,24,43,.08)}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:600;flex:1;padding:4px}
.bnav button.on{color:var(--navy)}
.bnav button .bi{width:24px;height:24px}

/* modal */
.modal{position:fixed;inset:0;z-index:100;background:rgba(8,16,35,.5);display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.modal .box{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:86vh;overflow:auto;padding:20px;position:relative}
.modal .x{position:absolute;right:14px;top:14px;width:32px;height:32px;border-radius:9px;background:var(--line2);
  display:grid;place-items:center;font-size:18px;color:var(--muted)}
.modal h3{font-size:16px;padding-right:38px}
.pad{display:flex;flex-direction:column;gap:14px}

@media(min-width:760px){
  .modal{align-items:center}
  .modal .box{border-radius:18px}
}
@media(max-width:980px){ .cols-hero{grid-template-columns:1fr} }
@media(max-width:760px){
  .hdr .tabs{display:none}
  .hdr .note{display:none}
  .bnav{display:flex}
  .ctrl{top:66px;padding:9px 12px;gap:8px}
  .wrap{padding:14px 12px 24px}
  .cols2{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .kpi .val{font-size:23px}
  .sel select{max-width:46vw}
  .search input{width:150px}
  .search .res{width:88vw}
  .fgroup{order:3;width:100%}
  .periods{order:2;width:100%}
}
@media(max-width:380px){ .kpi .val{font-size:20px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
@media print{
  body{padding:0;background:#fff;font-size:12px}
  .hdr,.ctrl,.bnav,.modal,#tabs,#bnav,.btn-clear,.sel,.search,
  .periods,button:not(.no-print){display:none!important}
  .wrap{padding:8px;max-width:100%}
  .card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .tbl th,.tbl td{padding:5px 7px}
  #printArea{display:block!important}
  #printArea .ph{font-size:16px;font-weight:700;color:#01216A;margin-bottom:4px}
  #printArea .ps{font-size:11px;color:#666;margin-bottom:14px}
  a[href]:after{content:none}
}
</style>
</head>

<script>
/* ============ CORE ============ */
const D=window.DATA, M=D.meta, R=D.rows, N=R.imp.length;
const PALETTE=['#01216A','#B11425','#3A5BA0','#D85A68','#6E86C0','#7E2230','#152C57','#E0982B',
 '#A9B8DD','#8A1320','#4C6BB0','#C24050','#26407F','#9aa6c4','#5a2630','#b9c4dd','#1f8a5b'];
// Set initial period to current month (1=Jan … 6=Jun), capped to available months
const _curMonth=(()=>{const m=new Date().getMonth()+1;return m<=M.months.length?m:M.months.length;})();
const state={period:_curMonth,vendor:null,zone:null,level:null,q:'',page:'principal',openClient:null};

const fmtN=v=>Math.round(v).toLocaleString('es-AR');
function fmtM(v){const a=Math.abs(v);
  if(a>=1e6)return '$'+(v/1e6).toLocaleString('es-AR',{minimumFractionDigits:1,maximumFractionDigits:1})+' M';
  if(a>=1e3)return '$'+Math.round(v/1e3).toLocaleString('es-AR')+' K';
  return '$'+fmtN(v);}
const fmtFull=v=>'$'+fmtN(v);
function fmtMonthsAgo(m){
  if(m>=12){const y=Math.floor(m/12),rem=m%12;
    return y+(y===1?' año':' años')+(rem>0?' y '+rem+(rem===1?' mes':' meses'):'');}
  return m+(m===1?' mes':' meses');
}
const pct=(a,b)=>b>0?a/b*100:0;
function monthsCount(){return state.period==='all'?M.months.length:1;}

/* indices passing current filters (with optional overrides) */
function filtered(ov){
  const f=Object.assign({},state,ov||{});
  const q=f.q?f.q.toLowerCase():null;
  const out=[];
  for(let i=0;i<N;i++){
    if(f.period!=='all'&&R.m[i]!==f.period)continue;
    if(f.vendor!=null&&R.v[i]!==f.vendor)continue;
    if(f.zone!=null&&R.z[i]!==f.zone)continue;
    if(f.level!=null&&R.n[i]!==f.level)continue;
    if(q&&M.articles[R.a[i]].toLowerCase().indexOf(q)<0)continue;
    out.push(i);
  }
  return out;
}
const sumImp=idx=>{let s=0;for(const i of idx)s+=R.imp[i];return s;};
const sumQ=idx=>{let s=0;for(const i of idx)s+=R.q[i];return s;};
function distinct(idx,arr){const s=new Set();for(const i of idx)s.add(arr[i]);return s.size;}
function groupSum(idx,arr){const m=new Map();for(const i of idx){m.set(arr[i],(m.get(arr[i])||0)+R.imp[i]);}return m;}
function ticketAvg(idx){const inv=new Map();for(const i of idx)inv.set(R.inv[i],(inv.get(R.inv[i])||0)+R.imp[i]);
  if(!inv.size)return 0;let s=0;inv.forEach(v=>s+=v);return s/inv.size;}
function topFrom(map,labels,n){return[...map.entries()].map(([k,v])=>({k,label:labels?labels[k]:k,v}))
  .sort((a,b)=>b.v-a.v).slice(0,n);}

/* ============ SVG WIDGETS ============ */
function donut(map,labels,size){
  size=size||150;const r=size/2-13,cx=size/2,cy=size/2,C=2*Math.PI*r;
  const items=[...map.entries()].map(([k,v])=>({k,v})).filter(d=>d.v>0).sort((a,b)=>b.v-a.v);
  const tot=items.reduce((s,d)=>s+d.v,0)||1;
  let off=0,segs='';const leg=[];
  items.forEach((d,i)=>{const frac=d.v/tot,col=PALETTE[i%PALETTE.length];
    const dash=frac*C;
    segs+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${col}" stroke-width="22"
      stroke-dasharray="${dash} ${C-dash}" stroke-dashoffset="${-off}"
      transform="rotate(-90 ${cx} ${cy})"><title>${labels[d.k]}: ${fmtM(d.v)} (${(frac*100).toFixed(0)}%)</title></circle>`;
    off+=dash;
    if(i<7)leg.push({c:col,n:labels[d.k],v:d.v,p:frac*100});});
  const legHtml=leg.map(l=>`<div class="li"><span class="dot" style="background:${l.c}"></span>
    <span class="ln">${l.n}</span><span class="lv">${l.p.toFixed(0)}%</span></div>`).join('')
    +(items.length>7?`<div class="li"><span class="dot" style="background:#cbd3e2"></span><span class="ln">Otros (${items.length-7})</span><span class="lv">${(items.slice(7).reduce((s,d)=>s+d.v,0)/tot*100).toFixed(0)}%</span></div>`:'');
  return `<div class="mix"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#eef1f6" stroke-width="22"/>${segs}
    <text x="${cx}" y="${cy-4}" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="20" fill="#0f182b">${fmtM(tot)}</text>
    <text x="${cx}" y="${cy+13}" text-anchor="middle" font-size="9" fill="#5b6b86" letter-spacing="1">TOTAL</text>
  </svg><div class="leg">${legHtml}</div></div>`;
}
function ringGauge(p){
  const cl=p>=100?'var(--ok)':p>=70?'var(--navy)':'var(--red)';
  const deg=Math.min(p,100)*3.6;
  return `<div class="ring" style="background:conic-gradient(${cl} ${deg}deg,#e6eaf2 0)">
    <div class="hole"><div class="pc num" style="color:${cl}">${p.toFixed(0)}%</div><div class="pl">del objetivo</div></div></div>`;
}

/* ============ CONTROLS ============ */
function buildControls(){
  const per=document.getElementById('periods');
  per.innerHTML=`<button data-p="all">Acumulado</button>`+
    M.months.map((m,i)=>`<button data-p="${i+1}">${m}</button>`).join('');
  per.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const p=b.dataset.p;state.period=p==='all'?'all':+p;render();});
  fillSel('selVendor','Todos los vendedores',M.vendors);
  fillSel('selZone','Todas las zonas',M.zones);
  fillSel('selLevel','Todos los niveles',M.levels);
  document.getElementById('selVendor').onchange=e=>{state.vendor=e.target.value===''?null:+e.target.value;render();};
  document.getElementById('selZone').onchange=e=>{state.zone=e.target.value===''?null:+e.target.value;render();};
  document.getElementById('selLevel').onchange=e=>{state.level=e.target.value===''?null:+e.target.value;render();};
  document.getElementById('clearF').onclick=()=>{state.vendor=state.zone=state.level=null;state.q='';render();};
  // nav
  document.querySelectorAll('#tabs button,#bnav button').forEach(b=>b.onclick=()=>{state.page=b.dataset.pg;state.openClient=null;render();});

}
function fillSel(id,ph,arr){
  document.getElementById(id).innerHTML=`<option value="">${ph}</option>`+
    arr.map((x,i)=>`<option value="${i}">${x}</option>`).join('');
}
function syncControls(){
  const isPrincipal=state.page==='principal';

  const isArticulos=state.page==='articulos';
  const isRent=state.page==='rentabilidad';
  const hideAll=isPrincipal||isClientes||isArticulos||isRent;
  document.querySelectorAll('#periods button').forEach(b=>
    b.classList.toggle('on',(b.dataset.p==='all'?'all':+b.dataset.p)===state.period));
  document.getElementById('periods').style.display=(isClientes||isArticulos||isRent)?'none':'';

  const sz=document.getElementById('selZone');sz.value=state.zone==null?'':state.zone;

  document.getElementById('selZoneWrap').classList.toggle('active',state.zone!=null);
  document.getElementById('selLevelWrap').style.display=(isClientes||isArticulos||isRent)?'none':'';

  document.querySelectorAll('#tabs button,#bnav button').forEach(b=>b.classList.toggle('on',b.dataset.pg===state.page));
  updateClear();

function updateClear(){
  const isPrincipal=state.page==='principal';
  const isOther=state.page==='clientes'||state.page==='articulos';
  const any=(isPrincipal||isOther?false:(state.vendor!=null||state.zone!=null))||(isOther?false:state.level!=null);
  document.getElementById('clearF').style.display=any?'inline-block':'none';
}

/* ============ SEARCH PANEL ============ */
function searchPanel(){
  const box=document.getElementById('searchRes');
  if(!state.q){box.classList.remove('show');return;}
  const idx=filtered();const m=groupSum(idx,R.a);
  const top=topFrom(m,M.articles,14);
  box.innerHTML=top.length?top.map(d=>`<div class="ri" data-a="${d.k}">
      <span class="rn">${d.label}</span><span class="rv">${fmtM(d.v)}</span></div>`).join('')
    :`<div class="empty">Sin ventas para “${state.q}” con los filtros actuales.</div>`;
  box.querySelectorAll('.ri').forEach(r=>r.onclick=()=>{articleModal(+r.dataset.a);});
  box.classList.add('show');
}

const app=()=>document.getElementById('app');
function render(){syncControls();
  if(state.page==='principal')renderPrincipal();
  else if(state.page==='vendedores')renderVendedores();
  else if(state.page==='zonas')renderZonas();
  else if(state.page==='clientes')renderClientes();
  else if(state.page==='articulos')renderArticulos();
  else if(state.page==='rentabilidad')renderRentabilidad();
  else renderRentabilidad();
  window.scrollTo({top:0,behavior:'instant'});
}
function filterNote(){
  const p=[];if(state.vendor!=null)p.push(M.vendors[state.vendor]);
  if(state.zone!=null)p.push(M.zones[state.zone]);
  if(state.level!=null)p.push(M.levels[state.level]);
  if(state.q)p.push('“'+state.q+'”');
  const per=state.period==='all'?'Acumulado 2026':M.monthsFull[state.period-1]+' 2026';
  return per+(p.length?' · '+p.join(' · '):'');
}

/* ---- PRINCIPAL ---- */
function renderPrincipal(){
  // Principal only filters by period, level and article search — vendor/zone ignored here
  const idx=filtered({vendor:null,zone:null});
  const total=sumImp(idx);
  const tgt=(state.level!=null ? M.levelTargets[state.level] : M.totalTarget)*monthsCount();
  const p=pct(total,tgt), gap=total-tgt;
  const ventas=distinct(idx,R.inv), cli=distinct(idx,R.c), uni=sumQ(idx);
  const avgCli=cli?total/cli:0;
  // break-even (always use unfiltered-by-level base for the bars, level only highlights)
  const idxAll=filtered({vendor:null,zone:null,level:null});
  const byLvlAll=groupSum(idxAll,R.n);
  const beItems=M.levels.map((nm,i)=>({i,nm,sales:byLvlAll.get(i)||0,tgt:M.levelTargets[i]*monthsCount()}))
    .filter(d=>d.tgt>0||d.nm==='Oportunidades').sort((a,b)=>b.tgt-a.tgt);
  const beHtml=beItems.map(d=>{const isSel=state.level===d.i;
    if(d.tgt===0){
      // Oportunidades: no target, just show sales as a bar relative to biggest level
      const maxSales=Math.max(...beItems.filter(x=>x.tgt>0).map(x=>x.sales),1);
      const w=Math.min(d.sales/maxSales*100,100);
      return `<div class="be ${isSel?'sel':''}" data-lvl="${d.i}">
        <div class="top"><span class="nm">${d.nm}</span>
          <span class="vals"><b>${fmtM(d.sales)}</b> <span style="color:var(--muted);font-size:11px;font-weight:400">sin objetivo</span></span></div>
        <div class="track"><div class="fill" style="width:${Math.max(w,1)}%;background:linear-gradient(90deg,#6E86C0,#3A5BA0)"></div></div></div>`;
    }
    const pp=pct(d.sales,d.tgt);const w=Math.min(pp,100);
    const col=pp>=100?'linear-gradient(90deg,#1f8a5b,#27a06c)':pp>=70?'linear-gradient(90deg,var(--navy),var(--navy2))':'linear-gradient(90deg,var(--red),var(--red2))';
    const out=w>78;
    return `<div class="be ${isSel?'sel':''}" data-lvl="${d.i}">
      <div class="top"><span class="nm">${d.nm}</span>
        <span class="vals"><b>${fmtM(d.sales)}</b> / ${fmtM(d.tgt)}</span></div>
      <div class="track"><div class="fill" style="width:${w}%;background:${col}">
        ${out?`<span class="pct">${pp.toFixed(0)}%</span>`:''}</div>
        ${out?'':`<span class="pct out">${pp.toFixed(0)}%</span>`}</div></div>`;}).join('');

  // vendors & zones ranking (unfiltered by level for ranking context)
  const vRank=topFrom(groupSum(idxAll,R.v),M.vendors,8);
  const zRank=topFrom(groupSum(idxAll,R.z),M.zones,8);
  const vMax=Math.max(...vRank.map(d=>d.v),1), zMax=Math.max(...zRank.map(d=>d.v),1);
  const rankRows=(arr,max,attr)=>arr.map(d=>`<div class="row" data-${attr}="${d.k}">
     <div class="lbl"><b>${d.label}</b><span>${fmtM(d.v)}</span></div>
     <div class="tr"><div class="fl" style="width:${d.v/max*100}%"></div></div></div>`).join('');

  // Article detail when a level is selected
  const lvlDetailHtml=state.level!=null?buildLevelDetail(state.level):'';

  app().innerHTML=`
  <div class="sec"><div class="sec-h"><span class="bar"></span><h2>Resumen general</h2><span class="sub">${filterNote()}</span></div>
    <div class="grid cols-hero">
      <div class="card hero">
        ${ringGauge(p)}
        <div class="h-val" style="margin-top:8px">${fmtFull(total)}</div>
        <div class="h-tgt">${state.level!=null?M.levels[state.level]+' · ':''} Objetivo ${state.period==='all'?'acumulado (×'+M.months.length+' meses)':'del mes'}: ${fmtFull(tgt)}</div>
        <div class="h-gap" style="color:${gap>=0?'var(--ok)':'var(--red)'}">${gap>=0?'▲ Supera por ':'▼ Falta '}${fmtM(Math.abs(gap))}</div>
      </div>
      <div class="grid kpis" style="align-content:start">
        ${kpi('Facturación',fmtM(total),'del objetivo $'+(tgt/1e6).toFixed(0)+' M',false,'$')}
        ${kpi('Ventas (comprob.)',fmtN(ventas),'facturas emitidas',false,'#')}
        ${kpi('Compra prom./cliente',fmtM(avgCli),'por cliente',false,'~')}
        ${kpi('Clientes activos',fmtN(cli),'con compras',false,'@')}
        ${kpi('Unidades vendidas',fmtN(uni),'ítems facturados',false,'▦')}
        ${kpi('Niveles en meta',beItems.filter(d=>d.tgt>0&&d.sales>=d.tgt).length+' / '+beItems.filter(d=>d.tgt>0).length,'superan equilibrio',beItems.filter(d=>d.tgt>0&&d.sales>=d.tgt).length<beItems.filter(d=>d.tgt>0).length/2,'◎')}
      </div>
    </div>
  </div>

  <div class="sec"><div class="sec-h"><span class="bar"></span><h2>Punto de equilibrio por nivel</h2>
    <span class="sub">ventas vs. objetivo${state.period==='all'?' acumulado':' mensual'} · tocá un nivel para ver su detalle</span></div>
    <div class="card"><div class="bes">${beHtml}</div></div>
  </div>

  ${lvlDetailHtml}

  <div class="sec"><div class="grid cols2">
    <div class="card"><div class="sec-h" style="margin-bottom:14px"><span class="bar"></span><h2>Ranking de vendedores</h2></div>
      <div class="rk">${rankRows(vRank,vMax,'vrank')}</div></div>
    <div class="card"><div class="sec-h" style="margin-bottom:14px"><span class="bar"></span><h2>Ranking de zonas</h2></div>
      <div class="rk">${rankRows(zRank,zMax,'zrank')}</div></div>
  </div></div>

  <div class="sec"><div class="card">
    <div class="sec-h" style="margin-bottom:6px"><span class="bar"></span><h2>Evolución mensual 2026</h2>
      <span class="sub">línea punteada = objetivo $300 M</span></div>
    <div class="trend">${trendChart(idx)}</div></div>
  </div>`;

  app().querySelectorAll('.be').forEach(b=>b.onclick=()=>{const l=+b.dataset.lvl;
    state.level=state.level===l?null:l;render();});
  app().querySelectorAll('[data-vrank]').forEach(r=>r.onclick=()=>{state.vendor=+r.dataset.vrank;state.page='vendedores';render();});
  app().querySelectorAll('[data-zrank]').forEach(r=>r.onclick=()=>{state.zone=+r.dataset.zrank;state.page='zonas';render();});
  app().querySelectorAll('[data-art]').forEach(r=>r.onclick=()=>articleModal(+r.dataset.art));
}

function buildLevelDetail(lvlIdx){
  const lvlName=M.levels[lvlIdx];
  const idx=filtered({vendor:null,zone:null}); // period + level + q
  const s=sumImp(idx), inv=distinct(idx,R.inv), cli=distinct(idx,R.c), uni=sumQ(idx);

  // Top 15 articles
  const aTop=topFrom(groupSum(idx,R.a),M.articles,15);
  const aMax=aTop.length?aTop[0].v:1;
  const artRows=aTop.map((d,k)=>{
    const pp=d.v/aMax*100;
    const colBar=k===0?'linear-gradient(90deg,var(--navy),var(--navy2))':
                 k<3?'linear-gradient(90deg,var(--red),var(--red2))':
                 'linear-gradient(90deg,#3A5BA0,#6E86C0)';
    return `<tr data-art="${d.k}" style="cursor:pointer">
      <td class="rk0">${k+1}</td>
      <td>
        <div style="font-size:12.5px;font-weight:600;margin-bottom:4px">${d.label}</div>
        <div class="tr"><div class="fl" style="width:${pp}%;background:${colBar}"></div></div>
      </td>
      <td class="r">${fmtM(d.v)}</td>
      <td class="r" style="color:var(--muted);font-family:Oswald;font-size:12px">${(d.v/s*100).toFixed(0)}%</td>
    </tr>`;}).join('');

  // Top clients for this level
  const cTop=topFrom(groupSum(idx,R.c),M.clients,8);
  const cMax=cTop.length?cTop[0].v:1;
  const cRows=cTop.map((d,k)=>`<tr data-cli="${d.k}" style="cursor:pointer">
    <td class="rk0">${k+1}</td><td><b>${d.label}</b></td>
    <td class="r">${fmtM(d.v)}</td></tr>`).join('');

  // Monthly trend for this level
  const idxAll6=filtered({vendor:null,zone:null,level:lvlIdx,period:'all'});
  const series6=Array(M.months.length).fill(0);for(const i of idxAll6)series6[R.m[i]-1]+=R.imp[i];
  const mxS=Math.max(...series6,1);
  const tgtMes=M.levelTargets[lvlIdx];
  const tgtAcum=tgtMes*6;
  const monthBars=series6.map((v,i)=>{
    const h=Math.max(v/mxS*80,v>0?3:0);
    const isSel=state.period===i+1;
    const col=isSel?'linear-gradient(180deg,var(--red2),var(--red))':'linear-gradient(180deg,var(--navy2),var(--navy))';
    const tgtH=tgtMes/mxS*80;
    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px">
      <div style="font-family:Oswald;font-size:9.5px;color:var(--navy);font-weight:700">${v>0?(v/1e6).toFixed(1)+'M':''}</div>
      <div style="width:100%;height:80px;display:flex;align-items:flex-end;position:relative">
        <div style="position:absolute;left:0;right:0;bottom:${tgtH}px;border-top:1.5px dashed var(--red);opacity:.5"></div>
        <div style="width:100%;height:${h}px;min-height:${v>0?'3px':'0'};background:${col};border-radius:4px 4px 0 0;transition:.4s"></div>
      </div>
      <div style="font-family:Oswald;font-size:10px;font-weight:${isSel?700:500};color:${isSel?'var(--red)':'var(--muted)'}">${M.months[i]}</div>
    </div>`;}).join('');

  return `<div class="sec" id="lvlDetail">
    <div class="sec-h">
      <span class="bar" style="background:var(--red)"></span>
      <h2>Detalle · ${lvlName}</h2>
      <span class="sub">${fmtM(s)} · ${cli} clientes · ${fmtN(inv)} comprobantes</span>
      <button onclick="state.level=null;render()" style="margin-left:8px;padding:4px 10px;border-radius:8px;background:#fdeaec;color:var(--red);font-size:12px;font-weight:700;cursor:pointer">✕ Cerrar</button>
    </div>
    <div class="grid kpis" style="margin-bottom:14px">
      ${kpi('Facturación nivel',fmtM(s),lvlName,false,'$')}
      ${kpi('Clientes',fmtN(cli),'compraron este nivel',false,'@')}
      ${kpi('Comprobantes',fmtN(inv),'emitidos',false,'#')}
      ${kpi('Unidades',fmtN(uni),'vendidas',false,'▦')}
    </div>
    <div class="card" style="margin-bottom:14px">
      <div class="sec-h" style="margin-bottom:10px"><span class="bar"></span><h2>Evolución mensual</h2>
        <span class="sub">punteado rojo = objetivo mensual ${fmtM(tgtMes)}</span></div>
      <div style="display:flex;gap:8px;align-items:flex-end;padding:4px 0">${monthBars}</div>
    </div>
    <div class="grid cols2">
      <div class="card">
        <div class="sec-h" style="margin-bottom:12px"><span class="bar"></span>
          <h2>Top artículos del nivel</h2><span class="sub">tocá para ver detalle</span></div>
        <table class="tbl">
          <thead><tr><th></th><th>Artículo</th><th class="r">Ventas</th><th class="r">%</th></tr></thead>
          <tbody>${artRows}</tbody>
        </table>
      </div>
      <div class="card">
        <div class="sec-h" style="margin-bottom:12px"><span class="bar"></span>
          <h2>Top clientes del nivel</h2><span class="sub">tocá para ver detalle</span></div>
        <table class="tbl">
          <thead><tr><th></th><th>Cliente</th><th class="r">Compras</th></tr></thead>
          <tbody>${cRows}</tbody>
        </table>
      </div>
    </div>
  </div>`;
}
function kpi(lab,val,sub,red,ic){
  return `<div class="kpi ${red?'red':''}"><span class="accent"></span><span class="ic num">${ic||''}</span>
    <div class="lab">${lab}</div><div class="val">${val}</div><div class="sub">${sub}</div></div>`;
}
function trendChart(baseIdx){
  // monthly series respecting all filters except period
  const ov=Object.assign({},state);delete ov.period;
  const idx=filtered({period:'all'});
  const series=Array(M.months.length).fill(0);for(const i of idx)series[R.m[i]-1]+=R.imp[i];
  const W=720,H=230,pl=54,pr=16,pt=18,pb=30;const iw=W-pl-pr,ih=H-pt-pb;
  const tgtLine=M.totalTarget;
  const max=Math.max(...series,tgtLine)*1.12;
  const x=i=>pl+iw*(i/(5));const y=v=>pt+ih*(1-v/max);
  const pts=series.map((v,i)=>[x(i),y(v)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=`M${pl} ${pt+ih} `+pts.map(p=>'L'+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')+` L${pl+iw} ${pt+ih} Z`;
  const gy=[0,.25,.5,.75,1].map(f=>{const v=max*f;return `<line x1="${pl}" y1="${y(v)}" x2="${pl+iw}" y2="${y(v)}" stroke="#eef1f6"/>
    <text x="${pl-8}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="#8a97ad" font-family="Oswald">${(v/1e6).toFixed(0)}M</text>`;}).join('');
  const dots=pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${state.period===i+1?6:4.5}" fill="${state.period===i+1?'#B11425':'#01216A'}" stroke="#fff" stroke-width="2">
     <title>${M.monthsFull[i]}: ${fmtM(series[i])}</title></circle>
     <text x="${p[0]}" y="${p[1]-12}" text-anchor="middle" font-size="9.5" font-family="Oswald" font-weight="600" fill="#0f182b">${(series[i]/1e6).toFixed(0)}M</text>`).join('');
  const xl=M.months.map((m,i)=>`<text x="${x(i)}" y="${H-9}" text-anchor="middle" font-size="11" fill="#5b6b86" font-weight="${state.period===i+1?700:500}">${m}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    <defs><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#01216A" stop-opacity=".22"/><stop offset="1" stop-color="#01216A" stop-opacity="0"/></linearGradient></defs>
    ${gy}
    <line x1="${pl}" y1="${y(tgtLine)}" x2="${pl+iw}" y2="${y(tgtLine)}" stroke="#B11425" stroke-width="1.6" stroke-dasharray="6 5"/>
    <text x="${pl+iw}" y="${y(tgtLine)-6}" text-anchor="end" font-size="10" fill="#B11425" font-weight="700" font-family="Oswald">OBJETIVO 300M</text>
    <path d="${area}" fill="url(#ar)"/>
    <path d="${line}" fill="none" stroke="#01216A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${xl}</svg>`;
}

/* ---- VENDEDORES ---- */
function renderVendedores(){
  const chips=`<div class="chips"><button data-v="" class="${state.vendor==null?'on':''}">Todos</button>`+
    M.vendors.map((v,i)=>`<button data-v="${i}" class="${state.vendor===i?'on':''}">${v}</button>`).join('')+`</div>`;
  let body;
  if(state.vendor==null){
    const idxAll=filtered({vendor:null});const totAll=sumImp(idxAll)||1;
    const rows=M.vendors.map((v,i)=>{const ix=filtered({vendor:i});const s=sumImp(ix);const cliN=distinct(ix,R.c);
      return{i,v,s,cli:cliN,avg:cliN?s/cliN:0,inv:distinct(ix,R.inv)};}).sort((a,b)=>b.s-a.s);
    const max=Math.max(...rows.map(r=>r.s),1);
    body=`<div class="card"><div class="sec-h" style="margin-bottom:14px"><span class="bar"></span><h2>Comparativa de vendedores</h2><span class="sub">${filterNote()}</span></div>
      <table class="tbl"><thead><tr><th></th><th>Vendedor</th><th class="r">Facturación</th><th class="r">Part.</th><th class="r">Clientes</th><th class="r">Compra/cliente</th></tr></thead>
      <tbody>${rows.map((r,k)=>`<tr data-v="${r.i}"><td class="rk0">${k+1}</td><td><b>${r.v}</b>
        <div class="tr" style="height:6px;margin-top:5px;background:#eef1f6;border-radius:4px"><div style="height:100%;width:${r.s/max*100}%;background:linear-gradient(90deg,var(--navy),var(--navy2));border-radius:4px"></div></div></td>
        <td class="r">${fmtM(r.s)}</td><td class="r">${pct(r.s,totAll).toFixed(0)}%</td>
        <td class="r">${r.cli}</td><td class="r">${fmtM(r.avg)}</td></tr>`).join('')}</tbody></table>
      <div class="hint" style="margin-top:14px">👆 <b>Tocá un vendedor</b> para ver su detalle: mix de productos, zonas y clientes.</div></div>`;
  }else{
    const idx=filtered();const s=sumImp(idx);
    const totAll=sumImp(filtered({vendor:null}))||1;
    const allV=M.vendors.map((v,i)=>({i,s:sumImp(filtered({vendor:i}))})).sort((a,b)=>b.s-a.s);
    const rankPos=allV.findIndex(d=>d.i===state.vendor)+1;
    const cli=distinct(idx,R.c),inv=distinct(idx,R.inv),uni=sumQ(idx);
    const avgCli=cli?s/cli:0;
    const zTop=topFrom(groupSum(idx,R.z),M.zones,6);const zMax=Math.max(...zTop.map(d=>d.v),1);
    const cTop=topFrom(groupSum(idx,R.c),M.clients,8);
    const aTop=topFrom(groupSum(idx,R.a),M.articles,8);
    body=`
    <div class="grid kpis" style="margin-bottom:14px">
      ${kpi('Facturación',fmtM(s),'ejercicio '+(state.period==='all'?'2026':M.monthsFull[state.period-1]),false,'$')}
      ${kpi('Part. en la empresa',pct(s,totAll).toFixed(1)+'%','del total filtrado',false,'%')}
      ${kpi('Ranking',rankPos+'º','de '+M.vendors.length+' vendedores',false,'★')}
      ${kpi('Clientes',fmtN(cli),'atendidos',false,'@')}
      ${kpi('Compra prom./cliente',fmtM(avgCli),'por cliente',false,'~')}
      ${kpi('Comprobantes',fmtN(inv),'emitidos',false,'#')}
    </div>
    <div class="grid cols2">
      <div class="card"><div class="sec-h" style="margin-bottom:12px"><span class="bar"></span><h2>Mix de productos</h2></div>
        ${(()=>{const lvlMap=groupSum(idx,R.n);const lvlList=[...lvlMap.entries()].map(([k,v])=>({k,label:M.levels[k],v})).filter(d=>d.v>0).sort((a,b)=>b.v-a.v);const mx=lvlList.length?lvlList[0].v:1;const tot=lvlList.reduce((s,d)=>s+d.v,0)||1;
        return '<div class="rk">'+lvlList.map((d,i)=>`<div class="row" style="cursor:default"><div class="lbl"><b style="display:flex;align-items:center;gap:6px"><span style="width:10px;height:10px;border-radius:2px;background:${PALETTE[i%PALETTE.length]};flex:none;display:inline-block"></span>${d.label}</b><span style="font-family:Oswald;font-weight:600;color:var(--ink)">${fmtM(d.v)}</span></div><div class="tr"><div class="fl" style="width:${d.v/mx*100}%;background:${PALETTE[i%PALETTE.length]}"></div></div></div>`).join('')+'</div>';})()}
      </div>
      <div class="card"><div class="sec-h" style="margin-bottom:12px"><span class="bar"></span><h2>Zonas con más ventas</h2></div>
        <div class="rk">${zTop.map(d=>`<div class="row" data-z="${d.k}"><div class="lbl"><b>${d.label}</b><span>${fmtM(d.v)}</span></div>
          <div class="tr"><div class="fl" style="width:${d.v/zMax*100}%"></div></div></div>`).join('')}</div></div>
    </div>
    <div class="grid cols2" style="margin-top:14px">
      <div class="card"><div class="sec-h" style="margin-bottom:12px"><span class="bar"></span><h2>Top clientes</h2></div>
        <table class="tbl"><tbody>${cTop.map((d,k)=>`<tr data-cli="${d.k}"><td class="rk0">${k+1}</td><td><b>${d.label}</b></td><td class="r">${fmtM(d.v)}</td></tr>`).join('')}</tbody></table></div>
      <div class="card"><div class="sec-h" style="margin-bottom:12px"><span class="bar"></span><h2>Top artículos</h2></div>
        <table class="tbl"><tbody>${aTop.map((d,k)=>`<tr data-art="${d.k}"><td class="rk0">${k+1}</td><td style="font-size:12px">${d.label}</td><td class="r">${fmtM(d.v)}</td></tr>`).join('')}</tbody></table></div>
    </div>`;
  }
  app().innerHTML=`<div class="sec"><div class="sec-h"><span class="bar"></span><h2>Vendedores</h2>
    <span class="sub">${filterNote()}</span></div>${chips}</div>${body}`;
  app().querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{state.vendor=b.dataset.v===''?null:+b.dataset.v;render();});
  app().querySelectorAll('tr[data-v]').forEach(r=>r.onclick=()=>{state.vendor=+r.dataset.v;render();});
  app().querySelectorAll('[data-z]').forEach(r=>r.onclick=()=>{state.zone=+r.dataset.z;state.page='zonas';render();});
  app().querySelectorAll('[data-cli]').forEach(r=>r.onclick=()=>clientModal(+r.dataset.cli));
  app().querySelectorAll('[data-art]').forEach(r=>r.onclick=()=>articleModal(+r.dataset.art));
}

/* ---- ZONAS ---- */
function renderZonas(){
  const sel=`<div class="sel" style="margin-bottom:4px"><select id="zpick">
    <option value="">— Elegí una zona para ver el detalle —</option>

/* ---- CLIENTES ---- */
function buildClientStats(){
  // All rows (no vendor/zone/level/period filter — full 2026 picture)
  const idxAll=filtered({vendor:null,zone:null,level:null,period:'all',q:''});
  const cm=new Map();
  for(const i of idxAll){
    let o=cm.get(R.c[i]);if(!o){o={tot:0,ms:new Array(M.months.length).fill(0),inv:new Set(),zones:new Map()};cm.set(R.c[i],o);}
    o.tot+=R.imp[i];o.ms[R.m[i]-1]+=R.imp[i];o.inv.add(R.inv[i]);
    o.zones.set(R.z[i],(o.zones.get(R.z[i])||0)+R.imp[i]);
  }
  const nMonths=M.months.length;
  return [...cm.entries()].map(([k,o])=>{
    const activeMonths=o.ms.filter(v=>v>0).length;
    // trailing consecutive months without purchase (from the most recent month back)
    let trailing=0;
    for(let i=nMonths-1;i>=0;i--){if(o.ms[i]===0)trailing++;else break;}
    // primary zone = zone with most accumulated sales for this client
    let primaryZone=-1,best=-1;
    o.zones.forEach((v,z)=>{if(v>best){best=v;primaryZone=z;}});
    return {k,name:M.clients[k],tot:o.tot,activeMonths,inv:o.inv.size,trailing,ms:o.ms,zone:primaryZone};
  }).sort((a,b)=>b.tot-a.tot);
}

}


/* ---- ARTICULOS ---- */
function buildArticleStats(){
  // Only consider articles WITH 2026 sales for the main ranking table
  const idxAll=filtered({vendor:null,zone:null,level:null,period:'all',q:''});
  const am=new Map();
  for(const i of idxAll){
    let o=am.get(R.a[i]);if(!o){o={imp:0,qty:0,ms:new Array(M.months.length).fill(0),levels:new Map()};am.set(R.a[i],o);}
    o.imp+=R.imp[i];o.qty+=R.q[i];o.ms[R.m[i]-1]+=R.imp[i];
    o.levels.set(R.n[i],(o.levels.get(R.n[i])||0)+R.imp[i]);
  }
  const nMonths=M.months.length;
  return [...am.entries()].map(([k,o])=>{
    const activeMonths=o.ms.filter(v=>v>0).length;
    let trailing=0;
    for(let i=nMonths-1;i>=0;i--){if(o.ms[i]===0)trailing++;else break;}
    let level=-1,best=-1;
    o.levels.forEach((v,n)=>{if(v>best){best=v;level=n;}});
    const monthsSince=M.articleMonthsSinceLastSale?M.articleMonthsSinceLastSale[k]:trailing;
    return {k,name:M.articles[k],imp:o.imp,qty:o.qty,activeMonths,trailing,level,monthsSince};
  });
}
// Articles whose last sale (across all available history) was more than 12 months ago.
// Includes articles that may have NO sales at all in 2026 (not present in buildArticleStats()).
function buildStaleArticles(){
  const msl=M.articleMonthsSinceLastSale;
  if(!msl)return[];
  const lvlIdx=M.articleLevelIdx;
  const oportIdx=M.levels.indexOf('Oportunidades');
  const noStaleNames=['Oportunidades','Griferías'];
  const statsByKey=new Map(buildArticleStats().map(a=>[a.k,a]));
  const out=[];
  for(let k=0;k<M.articles.length;k++){
    if(msl[k]>12){
      if(lvlIdx && noStaleNames.indexOf(M.levels[lvlIdx[k]])>=0)continue; // exclude Oportunidades & Griferías
      const s=statsByKey.get(k);
      out.push({k,name:M.articles[k],imp:s?s.imp:0,qty:s?s.qty:0,
        activeMonths:s?s.activeMonths:0,level:s?s.level:(lvlIdx?lvlIdx[k]:-1),monthsSince:msl[k]});
    }
  }
  return out.sort((a,b)=>b.monthsSince-a.monthsSince || b.imp-a.imp);
}

/* ---- RENTABILIDAD ---- */
const NO_COMISION = ['Mostrador','Daniel Hernández'];  // sin comisión

function fmtARS(n){
  if(!n && n!==0) return '';
  return Math.round(n).toLocaleString('es-AR');
}
function parseARS(s){
  return parseInt((s+'').replace(/\./g,'').replace(/[^\d]/g,''),10)||0;
}

function renderRentabilidad(){
  if(!window.rentState) window.rentState={
    gastoFijoTotal:0, totalVentasRef:0, selMonth:null,
    descPct:10, comPct:4, iibbPct:4.2, gfFinPct:3
  };
  const RS = window.rentState;

  // Months with MB data
  const mbMonths = new Set();
  for(let i=0;i<R.imp.length;i++) if(R.mb[i]!=null) mbMonths.add(R.m[i]);
  const mbMonthsArr = [...mbMonths].sort((a,b)=>a-b);
  if(RS.selMonth==null||!mbMonths.has(RS.selMonth))
    RS.selMonth = mbMonthsArr[mbMonthsArr.length-1]||null;

  if(!mbMonthsArr.length){
    app().innerHTML=`<div class="sec"><div class="hint" style="padding:32px;text-align:center">
      <div style="font-size:32px;margin-bottom:12px">📊</div>
      <b>Sin datos de margen bruto todavía</b><br>
      <span style="color:var(--muted)">Disponibles a partir del primer mes con la columna "Margen bruto" completa en el Excel.</span>
    </div></div>`;
    return;
  }

  const fletesIdx = M.levels.indexOf('Fletes');

  app().innerHTML=`
  <div class="sec">
    <div class="sec-h" style="flex-wrap:wrap;gap:8px">
      <span class="bar" style="background:var(--ok)"></span><h2>Rentabilidad</h2>
      <span class="sub">Margen neto por deducción · Datos al ${M.lastDay}</span>
      <button onclick="openCotizador()" style="margin-left:auto;padding:8px 18px;border-radius:9px;background:#01216A;color:#fff;border:none;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px">
        💰 Abrir cotizador
      </button>
    </div>

    <!-- Selector de mes -->
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
      ${mbMonthsArr.map(m=>`<button data-rentm="${m}" style="padding:7px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;
        border:1.5px solid ${m===RS.selMonth?'var(--navy)':'var(--line)'};
        background:${m===RS.selMonth?'var(--navy)':'#fff'};color:${m===RS.selMonth?'#fff':'var(--muted)'}">
        ${M.months[m-1]} 2026</button>`).join('')}
    </div>

    <!-- Parámetros -->
    <div class="card" style="margin-bottom:14px">
      <div class="sec-h" style="margin-bottom:14px"><span class="bar" style="background:var(--navy)"></span><h2>Parámetros</h2>
        <span class="sub">Los cambios recalculan todo en tiempo real</span></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px">

        <div style="background:var(--bg);border-radius:10px;padding:12px">
          <div style="font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Tasas fijas</div>
          ${paramRow('Descuento pago','descPct',RS.descPct,'% sobre monto de venta')}
          ${paramRow('Comisión vendedor','comPct',RS.comPct,'% sobre cobrado (excluye Mostrador y D. Hernández)')}
          ${paramRow('IIBB + Comercio e Ind.','iibbPct',RS.iibbPct,'% solo Línea 1')}
          ${paramRow('Gastos financieros','gfFinPct',RS.gfFinPct,'% sobre monto de venta')}
        </div>

        <div style="background:var(--bg);border-radius:10px;padding:12px">
          <div style="font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">Gastos fijos del período</div>
          <div style="margin-bottom:12px">
            <label style="font-size:11px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px">Total ventas del período ($)</label>
            <input id="rent-ventas" type="text" inputmode="numeric" value="${fmtARS(RS.totalVentasRef)||''}"
              placeholder="Ej: 20.000.000"
              style="width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;font-size:14px;font-family:Oswald,sans-serif;font-weight:600;color:var(--navy)">
            <div style="font-size:11px;color:var(--muted);margin-top:3px">Para calcular el % de gasto fijo sobre ventas</div>
          </div>
          <div style="margin-bottom:10px">
            <label style="font-size:11px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px">Total gasto fijo ($)</label>
            <input id="rent-gasto" type="text" inputmode="numeric" value="${fmtARS(RS.gastoFijoTotal)||''}"
              placeholder="Ej: 5.000.000"
              style="width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;font-size:14px;font-family:Oswald,sans-serif;font-weight:600;color:var(--navy)">
          </div>
          <div style="padding:8px 10px;background:#fff;border-radius:8px;border:1px solid var(--line);display:flex;justify-content:space-between;align-items:center">
            <span style="font-size:11.5px;color:var(--muted)">% GF aplicado a cada venta</span>
            <span id="gf-pct-show" style="font-family:Oswald;font-size:16px;font-weight:700;color:var(--navy)">—</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Resultados (actualizados por recalcRent) -->
    <div id="rent-outputs"></div>
  </div>`;

  // Wire month selector
  app().querySelectorAll('[data-rentm]').forEach(btn=>{
    btn.onclick=()=>{RS.selMonth=+btn.dataset.rentm; renderRentabilidad();};
  });

  // Wire param inputs (stable: don't re-render, just recalc)
  ['descPct','comPct','iibbPct','gfFinPct'].forEach(k=>{
    const el=document.getElementById('p-'+k);
    if(el) el.addEventListener('input',e=>{RS[k]=parseFloat(e.target.value)||0; recalcRent();});
  });

  // Wire GF inputs with formatting (type=text, add dots while typing)
  function wireMoneyInput(id, stateKey){
    const el=document.getElementById(id);
    if(!el) return;
    el.addEventListener('input', function(){
      const cursorPos = this.selectionStart;
      const rawBefore = this.value.replace(/\./g,'');
      const formatted = rawBefore.replace(/\D/g,'').replace(/\B(?=(\d{3})+(?!\d))/g,'.');
      const addedDots = formatted.length - rawBefore.replace(/\D/g,'').length;
      this.value = formatted;
      // Restore cursor (dots added to the left shift position)
      const newPos = cursorPos + addedDots;
      this.setSelectionRange(newPos, newPos);
      RS[stateKey] = parseARS(formatted);
      recalcRent();
    });
  }
  wireMoneyInput('rent-ventas','totalVentasRef');
  wireMoneyInput('rent-gasto','gastoFijoTotal');

  recalcRent();
}

function recalcRent(){
  const RS = window.rentState;
  if(!RS) return;
  const out = document.getElementById('rent-outputs');
  if(!out) return;

  const descPct  = RS.descPct  /100;
  const comPct   = RS.comPct   /100;
  const iibbPct  = RS.iibbPct  /100;
  const gfFinPct = RS.gfFinPct /100;
  const gfPct    = RS.totalVentasRef>0 ? RS.gastoFijoTotal/RS.totalVentasRef : 0;

  // Update GF% display
  const gfEl = document.getElementById('gf-pct-show');
  if(gfEl) gfEl.textContent = RS.totalVentasRef>0 ? (gfPct*100).toFixed(2)+'%' : '— (ingresá ventas)';

  const fletesIdx = M.levels.indexOf('Fletes');

  let totMonto=0,totDescuento=0,totCosto=0,totComision=0,totIIBB=0,totGF=0,totGFfin=0,totResultado=0;
  const byVend=new Map(), byNivel=new Map(), detail=[];

  for(let i=0;i<R.imp.length;i++){
    if(R.m[i]!==RS.selMonth || R.mb[i]==null) continue;
    if(R.n[i]===fletesIdx) continue;  // excluir Fletes

    const monto    = R.imp[i];
    const mb       = R.mb[i]/100;
    const linea    = R.ln[i];
    const cobrado  = monto*(1-descPct);
    const descuento= monto*descPct;
    const costo    = monto*(1-mb);
    const vname    = M.vendors[R.v[i]]||'';
    const comision = NO_COMISION.includes(vname) ? 0 : cobrado*comPct;
    const iibb     = linea===1 ? monto*iibbPct : 0;
    const gf       = monto*gfPct;
    const gfFin    = monto*gfFinPct;
    const resultado= monto-descuento-costo-comision-iibb-gf-gfFin;
    const mneto    = monto>0?resultado/monto*100:0;

    totMonto+=monto;totDescuento+=descuento;totCosto+=costo;
    totComision+=comision;totIIBB+=iibb;totGF+=gf;totGFfin+=gfFin;totResultado+=resultado;

    const nname=M.levels[R.n[i]]||'—';
    if(!byVend.has(R.v[i])) byVend.set(R.v[i],{name:vname,monto:0,resultado:0,filas:0,com:0,iibb:0,costo:0,nocom:NO_COMISION.includes(vname)});
    const bv=byVend.get(R.v[i]);
    bv.monto+=monto;bv.resultado+=resultado;bv.filas++;bv.com+=comision;bv.iibb+=iibb;bv.costo+=costo;
    if(!byNivel.has(R.n[i])) byNivel.set(R.n[i],{name:nname,monto:0,resultado:0,filas:0,mb_sum:0});
    const bn=byNivel.get(R.n[i]);
    bn.monto+=monto;bn.resultado+=resultado;bn.filas++;bn.mb_sum+=R.mb[i];

    detail.push({monto,cobrado,costo,descuento,comision,iibb,gf,gfFin,resultado,mneto,mb:R.mb[i],linea,artIdx:R.a[i],vname,nname,nocom:NO_COMISION.includes(vname)});
  }

  const totMN = totMonto>0?totResultado/totMonto*100:0;
  const mbAvg  = detail.length>0?detail.reduce((s,r)=>s+r.mb,0)/detail.length:0;

  const cascade=[
    {lab:'Ventas totales (excl. Fletes)',val:totMonto,       pct:100,                                            col:'var(--navy)',isBase:true},
    {lab:'− Descuento '+RS.descPct+'%', val:-totDescuento,  pct:-totDescuento/totMonto*100,                    col:'var(--red)'},
    {lab:'− Costo de mercadería',       val:-totCosto,       pct:-totCosto/totMonto*100,                        col:'var(--red)'},
    {lab:'= Margen bruto $',            val:totMonto-totDescuento-totCosto, pct:(totMonto-totDescuento-totCosto)/totMonto*100, col:'var(--amber)',isSub:true},
    {lab:'− Comisión vendedor '+RS.comPct+'%',val:-totComision,pct:-totComision/totMonto*100,                  col:'var(--red)'},
    {lab:'− IIBB + CyI '+RS.iibbPct+'% (L1)',val:-totIIBB,  pct:-totIIBB/totMonto*100,                       col:'var(--red)'},
    {lab:'− Gastos fijos '+(gfPct*100).toFixed(2)+'%',val:-totGF,pct:-totGF/totMonto*100,                     col:'var(--red)'},
    {lab:'− Gastos financieros '+RS.gfFinPct+'%',val:-totGFfin,pct:-totGFfin/totMonto*100,                    col:'var(--red)'},
    {lab:'= RESULTADO NETO',            val:totResultado,    pct:totMN,                                         col:totResultado>=0?'var(--ok)':'var(--red)',isTotal:true},
  ];

  const vendArr  = [...byVend.values()].sort((a,b)=>b.monto-a.monto);
  const nivelArr = [...byNivel.values()].sort((a,b)=>b.monto-a.monto);

  out.innerHTML=`
    <!-- KPIs -->
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin-bottom:14px">
      ${kpiRent('Ventas del mes',fmtM(totMonto),detail.length+' líneas (sin Fletes)',false,'var(--navy)')}
      ${kpiRent('MB promedio',mbAvg.toFixed(1)+'%','margen bruto sobre precio de venta',false,'var(--amber)')}
      ${kpiRent('GF aplicado',(gfPct*100).toFixed(2)+'%',gfPct>0?'$'+fmtARS(totGF)+' en total':'Ingresá ventas y gasto fijo',false,'var(--muted)')}
      ${kpiRent('Resultado neto',fmtM(totResultado),totMN.toFixed(2)+'% sobre ventas',totResultado<0,totResultado>=0?'var(--ok)':'var(--red)')}
    </div>

    <!-- Cascada -->
    <div class="card" style="margin-bottom:14px">
      <div class="sec-h" style="margin-bottom:12px"><span class="bar" style="background:var(--amber)"></span><h2>Desglose paso a paso</h2></div>
      <div style="overflow-x:auto"><table class="tbl" style="min-width:480px">
        <thead><tr><th>Concepto</th><th class="r">Monto ($)</th><th class="r">% sobre ventas</th><th>Barra</th></tr></thead>
        <tbody>${cascade.map(c=>{
          if(!isFinite(c.pct)) return '';
          const bw=Math.min(Math.abs(c.pct),100);
          const bc=c.isBase?'var(--navy)':c.isSub?'var(--amber)':c.isTotal?(totResultado>=0?'var(--ok)':'var(--red)'):'var(--red)';
          const bg=c.isBase?'#f4f7ff':c.isSub?'#fff8f0':c.isTotal?(totResultado>=0?'#f0faf5':'#fff8f8'):'';
          const fw=c.isBase||c.isSub||c.isTotal?'font-weight:700':'';
          return `<tr style="background:${bg}">
            <td style="${fw}">${c.lab}</td>
            <td class="r" style="font-family:Oswald;font-weight:600;color:${c.col}">${c.val>=0?'':'−'}$${fmtARS(Math.abs(c.val))}</td>
            <td class="r" style="color:${c.col};font-family:Oswald;font-weight:600">${c.pct>=0?'+':''}${c.pct.toFixed(2)}%</td>
            <td style="width:28%;padding-right:12px"><div style="background:#eef3ff;border-radius:4px;height:10px">
              <div style="height:10px;border-radius:4px;background:${bc};width:${bw}%"></div></div></td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>
    </div>

    <!-- Por vendedor -->
    <div class="card" style="margin-bottom:14px">
      <div class="sec-h" style="margin-bottom:12px"><span class="bar" style="background:var(--navy2)"></span><h2>Por vendedor</h2></div>
      <table class="tbl">
        <thead><tr><th>Vendedor</th><th class="r">Ventas</th><th class="r">MB prom.</th><th class="r">Comisión</th><th class="r">IIBB</th><th class="r">Resultado</th><th class="r">Margen neto</th></tr></thead>
        <tbody>${vendArr.map(v=>{
          const mn=v.monto>0?v.resultado/v.monto*100:0;
          const mbv=v.monto>0?(v.monto-v.costo)/v.monto*100:0;
          return `<tr>
            <td><b>${v.name}</b>${v.nocom?' <span style="font-size:10px;background:#f0faf5;color:var(--ok);padding:2px 5px;border-radius:4px">sin comisión</span>':''}<br>
              <span style="font-size:11px;color:var(--muted)">${v.filas} líneas</span></td>
            <td class="r">${fmtM(v.monto)}</td>
            <td class="r" style="color:var(--amber)">${mbv.toFixed(1)}%</td>
            <td class="r" style="color:var(--muted)">${v.nocom?'—':fmtM(v.com)}</td>
            <td class="r" style="color:var(--muted)">${fmtM(v.iibb)}</td>
            <td class="r" style="color:${v.resultado>=0?'var(--ok)':'var(--red)'};font-weight:700">${fmtM(v.resultado)}</td>
            <td class="r" style="color:${mn>=0?'var(--ok)':'var(--red)'};font-weight:700">${mn.toFixed(2)}%</td>
          </tr>`;
        }).join('')}</tbody>
      </table>
    </div>

    <!-- Por nivel -->
    <div class="card" style="margin-bottom:14px">
      <div class="sec-h" style="margin-bottom:12px"><span class="bar" style="background:var(--navy2)"></span><h2>Por nivel</h2></div>
      <table class="tbl">
        <thead><tr><th>Nivel</th><th class="r">Ventas</th><th class="r">MB prom.</th><th class="r">Resultado</th><th class="r">Margen neto</th><th class="r">Líneas</th></tr></thead>
        <tbody>${nivelArr.map(n=>{
          const mn=n.monto>0?n.resultado/n.monto*100:0;
          return `<tr>
            <td><b>${n.name}</b></td>
            <td class="r">${fmtM(n.monto)}</td>
            <td class="r" style="color:var(--amber)">${(n.mb_sum/n.filas).toFixed(1)}%</td>
            <td class="r" style="color:${n.resultado>=0?'var(--ok)':'var(--red)'};font-weight:700">${fmtM(n.resultado)}</td>
            <td class="r" style="color:${mn>=0?'var(--ok)':'var(--red)'};font-weight:700">${mn.toFixed(2)}%</td>
            <td class="r" style="color:var(--muted)">${n.filas}</td>
          </tr>`;
        }).join('')}</tbody>
      </table>
    </div>

    <!-- Detalle -->
    <div class="card">
      <div class="sec-h" style="margin-bottom:10px"><span class="bar" style="background:var(--muted)"></span>
        <h2>Detalle por transacción</h2><span class="sub">Top 50 por monto</span></div>
      <div style="overflow-x:auto"><table class="tbl" style="min-width:720px;font-size:12px">
        <thead><tr><th>Artículo</th><th>Nivel</th><th>Vendedor</th><th>L</th>
          <th class="r">Monto</th><th class="r">MB%</th><th class="r">Cobrado</th>
          <th class="r">Costo</th><th class="r">Comis.</th><th class="r">IIBB</th>
          <th class="r">GF</th><th class="r">GF fin.</th>
          <th class="r" style="color:var(--ok)">Resultado</th><th class="r">%neto</th>
        </tr></thead>
        <tbody>${detail.sort((a,b)=>b.monto-a.monto).slice(0,50).map(r=>`<tr>
          <td style="font-size:11px;font-weight:600;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${M.articles[r.artIdx]}">${M.articles[r.artIdx]}</td>
          <td style="font-size:11px;color:var(--muted)">${r.nname}</td>
          <td style="font-size:11px;color:var(--muted)">${r.vname.split(' ')[0]}</td>
          <td style="font-size:11px;text-align:center">${r.linea}</td>
          <td class="r">${fmtM(r.monto)}</td>
          <td class="r" style="color:var(--amber)">${r.mb.toFixed(1)}%</td>
          <td class="r" style="color:var(--muted)">${fmtM(r.cobrado)}</td>
          <td class="r" style="color:var(--red)">${fmtM(r.costo)}</td>
          <td class="r" style="color:var(--muted)">${r.nocom?'—':fmtM(r.comision)}</td>
          <td class="r" style="color:var(--muted)">${r.linea===1?fmtM(r.iibb):'—'}</td>
          <td class="r" style="color:var(--muted)">${fmtM(r.gf)}</td>
          <td class="r" style="color:var(--muted)">${fmtM(r.gfFin)}</td>
          <td class="r" style="color:${r.resultado>=0?'var(--ok)':'var(--red)'};font-weight:700">${fmtM(r.resultado)}</td>
          <td class="r" style="color:${r.mneto>=0?'var(--ok)':'var(--red)'};font-weight:700">${r.mneto.toFixed(1)}%</td>
        </tr>`).join('')}</tbody>
      </table></div>
    </div>`;
}

function paramRow(label, key, unit, val, hint){
  return `<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line2)">
    <div>
      <div style="font-size:12px;font-weight:600;color:var(--ink)">${label}</div>
      <div style="font-size:10.5px;color:var(--muted)">${hint}</div>
    </div>
    <div style="display:flex;align-items:center;gap:4px">
      <input id="p-${key}" type="number" min="0" max="100" step="0.1" value="${val}"
        style="width:60px;padding:5px 6px;border:1px solid var(--line);border-radius:7px;font-size:13px;font-family:Oswald,sans-serif;font-weight:600;color:var(--navy);text-align:right">
      <span style="font-size:12px;color:var(--muted)">${unit}</span>
    </div>
  </div>`;
}

function kpiRent(lab,val,sub,red,col){
  return `<div style="background:#fff;border-radius:11px;padding:14px 15px;border-left:4px solid ${col};box-shadow:0 1px 6px rgba(1,33,106,.06)">
    <div style="font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px">${lab}</div>
    <div style="font-family:Oswald,sans-serif;font-size:22px;font-weight:700;color:${col};line-height:1.1">${val}</div>
    <div style="font-size:11px;color:var(--muted);margin-top:3px">${sub}</div>
  </div>`;
}


/* ---- COTIZADOR ---- */
function openCotizador(){
  if(!window.rentState) window.rentState={gastoFijoTotal:0,totalVentasRef:0,selMonth:null,descPct:10,comPct:4,iibbPct:4.2,gfFinPct:3};
  const RS=window.rentState;

  // Modal overlay
  let overlay=document.getElementById('cotizadorOverlay');
  if(overlay) overlay.remove();
  overlay=document.createElement('div');
  overlay.id='cotizadorOverlay';
  overlay.style.cssText='position:fixed;inset:0;background:rgba(1,33,106,.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px';
  overlay.innerHTML=`
  <div style="background:#fff;border-radius:16px;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;box-shadow:0 8px 48px rgba(1,33,106,.25)">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:18px 20px 12px;border-bottom:1px solid #dde4f5;position:sticky;top:0;background:#fff;z-index:1;border-radius:16px 16px 0 0">
      <div>
        <div style="font-family:Oswald,sans-serif;font-size:18px;font-weight:700;color:#01216A">💰 Cotizador</div>
        <div style="font-size:12px;color:#5b6b86;margin-top:2px">Calculá el margen neto de una venta antes de cerrarla</div>
      </div>
      <button id="closeCotiz" style="background:#f4f7ff;border:none;border-radius:50%;width:32px;height:32px;font-size:18px;cursor:pointer;color:#5b6b86;line-height:32px;text-align:center">✕</button>
    </div>

    <div style="padding:18px 20px">

      <!-- Items de la cotización -->
      <div style="font-size:11px;font-weight:700;color:#5b6b86;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">Ítems de la venta</div>
      <div id="cotiz-items"></div>
      <button id="cotiz-add-item" style="margin-top:8px;padding:8px 16px;border-radius:8px;border:1.5px dashed #c9d6f5;background:#f4f7ff;color:#01216A;font-size:13px;font-weight:600;cursor:pointer;width:100%">+ Agregar ítem</button>

      <div style="height:1px;background:#dde4f5;margin:16px 0"></div>

      <!-- Parámetros de la cotización -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">
        <div>
          <label style="font-size:11px;font-weight:700;color:#5b6b86;text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:5px">Vendedor</label>
          <select id="cotiz-vend" style="width:100%;padding:9px 10px;border:1.5px solid #dde4f5;border-radius:9px;font-size:13px;font-weight:600;color:#0f182b">
            ${M.vendors.map((v,i)=>`<option value="${i}">${v}</option>`).join('')}
          </select>
        </div>
        <div>
          <label style="font-size:11px;font-weight:700;color:#5b6b86;text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:5px">Línea de venta</label>
          <div style="display:flex;gap:8px">
            <button class="cotiz-linea-btn" data-l="1" style="flex:1;padding:9px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;border:1.5px solid #01216A;background:#01216A;color:#fff">Línea 1<br><span style="font-size:10px;font-weight:400">Facturado</span></button>
            <button class="cotiz-linea-btn" data-l="2" style="flex:1;padding:9px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;border:1.5px solid #dde4f5;background:#fff;color:#5b6b86">Línea 2<br><span style="font-size:10px;font-weight:400">Sin IIBB</span></button>
          </div>
        </div>
      </div>

      <div style="height:1px;background:#dde4f5;margin-bottom:14px"></div>

      <!-- Resultado -->
      <div id="cotiz-result"></div>
    </div>
  </div>`;
  document.body.appendChild(overlay);

  // State
  let cotizLinea=1;
  let cotizItems=[{desc:'',monto:'',mb:'',fmt:''}]; // desc, monto(raw), mb(%), fmt(display)

  function getVendName(){
    const sel=document.getElementById('cotiz-vend');
    return sel?M.vendors[+sel.value]:'';
  }

  function fmtARSc(s){
    const d=(s+'').replace(/\D/g,'');
    return d.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  }
  function parseARSc(s){ return parseInt((s+'').replace(/\./g,''),10)||0; }

  function renderItems(){
    const el=document.getElementById('cotiz-items');
    if(!el) return;
    el.innerHTML=cotizItems.map((it,i)=>`
    <div style="display:grid;grid-template-columns:1fr 130px 80px ${cotizItems.length>1?'28px':'0px'};gap:8px;margin-bottom:8px;align-items:start">
      <div>
        ${i===0?'<label style="font-size:10.5px;font-weight:600;color:#5b6b86;display:block;margin-bottom:3px">Descripción</label>':''}
        <input data-ifield="desc" data-idx="${i}" type="text" value="${it.desc}" placeholder="Artículo o descripción"
          style="width:100%;padding:9px 10px;border:1.5px solid #dde4f5;border-radius:9px;font-size:13px;color:#0f182b">
      </div>
      <div>
        ${i===0?'<label style="font-size:10.5px;font-weight:600;color:#5b6b86;display:block;margin-bottom:3px">Monto lista ($)</label>':''}
        <input data-ifield="fmt" data-idx="${i}" type="text" inputmode="numeric" value="${it.fmt}" placeholder="0"
          style="width:100%;padding:9px 10px;border:1.5px solid #dde4f5;border-radius:9px;font-size:13px;font-family:Oswald,sans-serif;font-weight:600;color:#01216A;text-align:right">
      </div>
      <div>
        ${i===0?'<label style="font-size:10.5px;font-weight:600;color:#5b6b86;display:block;margin-bottom:3px">MB %</label>':''}
        <input data-ifield="mb" data-idx="${i}" type="number" min="-100" max="100" step="0.1" value="${it.mb}" placeholder="0"
          style="width:100%;padding:9px 10px;border:1.5px solid #dde4f5;border-radius:9px;font-size:13px;font-family:Oswald,sans-serif;font-weight:600;color:#01216A;text-align:right">
      </div>
      ${cotizItems.length>1?`<div style="${i===0?'margin-top:22px':''}">
        <button data-del="${i}" style="width:28px;height:38px;border-radius:7px;border:1px solid #f6c6cc;background:#fff8f8;color:#B11425;font-size:16px;cursor:pointer">✕</button>
      </div>`:'<div></div>'}
    </div>`).join('');

    // Wire inputs
    el.querySelectorAll('[data-ifield]').forEach(inp=>{
      const idx=+inp.dataset.idx, field=inp.dataset.ifield;
      inp.addEventListener('input',e=>{
        if(field==='fmt'){
          const raw=(e.target.value+'').replace(/\D/g,'');
          const formatted=raw.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
          const cur=e.target.selectionStart;
          const before=(e.target.value.slice(0,cur).replace(/\./g,'')).length;
          e.target.value=formatted;
          // restore cursor
          let pos=0,count=0;
          for(let i=0;i<formatted.length;i++){ if(formatted[i]!='.')count++; if(count===before){pos=i+1;break;} }
          e.target.setSelectionRange(pos,pos);
          cotizItems[idx].fmt=formatted;
          cotizItems[idx].monto=parseARSc(formatted);
        } else {
          cotizItems[idx][field]=e.target.value;
        }
        calcCotiz();
      });
    });
    el.querySelectorAll('[data-del]').forEach(btn=>{
      btn.addEventListener('click',()=>{cotizItems.splice(+btn.dataset.del,1);renderItems();calcCotiz();});
    });
  }

  function calcCotiz(){
    const descPct =RS.descPct /100;
    const comPct  =RS.comPct  /100;
    const iibbPct =RS.iibbPct /100;
    const gfFinPct=RS.gfFinPct/100;
    const gfPct   =RS.totalVentasRef>0?RS.gastoFijoTotal/RS.totalVentasRef:0;
    const vendName=getVendName();
    const sinCom  =['Mostrador','Daniel Hernández'].includes(vendName);

    let rows=[];
    cotizItems.forEach(it=>{
      const monto=it.monto||0; if(!monto) return;
      const mb  =parseFloat(it.mb)||0;
      const cobrado  =monto*(1-descPct);
      const descuento=monto*descPct;
      const costo    =monto*(1-mb/100);
      const comision =sinCom?0:cobrado*comPct;
      const iibb     =cotizLinea===1?monto*iibbPct:0;
      const gf       =monto*gfPct;
      const gfFin    =monto*gfFinPct;
      const resultado=monto-descuento-costo-comision-iibb-gf-gfFin;
      rows.push({desc:it.desc||'Ítem',monto,cobrado,descuento,costo,comision,iibb,gf,gfFin,resultado,mb,sinCom});
    });

    const tot={monto:0,cobrado:0,descuento:0,costo:0,comision:0,iibb:0,gf:0,gfFin:0,resultado:0};
    rows.forEach(r=>{Object.keys(tot).forEach(k=>tot[k]+=r[k]);});
    const mn=tot.monto>0?tot.resultado/tot.monto*100:0;

    const el=document.getElementById('cotiz-result');
    if(!el) return;
    if(!rows.length){el.innerHTML='<div style="text-align:center;color:#5b6b86;padding:16px;font-size:13px">Ingresá al menos un ítem con monto y MB%</div>';return;}

    const colRes=tot.resultado>=0?'#1f8a5b':'#B11425';
    const bgRes =tot.resultado>=0?'#f0faf5':'#fff8f8';
    const bdRes =tot.resultado>=0?'#c3e6d6':'#f6c6cc';

    el.innerHTML=`
    <!-- Resumen total -->
    <div style="border-radius:12px;padding:16px;background:${bgRes};border:1.5px solid ${bdRes};margin-bottom:14px">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px">
        <div><div style="font-size:10.5px;color:#5b6b86;font-weight:600;margin-bottom:3px">Precio lista</div>
          <div style="font-family:Oswald,sans-serif;font-size:18px;font-weight:700;color:#0f182b">$${fmtARS(tot.monto)}</div></div>
        <div><div style="font-size:10.5px;color:#5b6b86;font-weight:600;margin-bottom:3px">Lo cobra el cliente</div>
          <div style="font-family:Oswald,sans-serif;font-size:18px;font-weight:700;color:#01216A">$${fmtARS(tot.cobrado)}</div>
          <div style="font-size:10.5px;color:#5b6b86">con ${RS.descPct}% dto.</div></div>
        <div><div style="font-size:10.5px;color:#5b6b86;font-weight:600;margin-bottom:3px">Resultado neto</div>
          <div style="font-family:Oswald,sans-serif;font-size:22px;font-weight:700;color:${colRes}">$${fmtARS(tot.resultado)}</div>
          <div style="font-size:11px;font-weight:700;color:${colRes}">${mn.toFixed(2)}% sobre lista</div></div>
      </div>

      <!-- Cascada compacta -->
      <div style="background:#fff;border-radius:9px;overflow:hidden;border:1px solid ${bdRes}">
        ${[
          ['Precio lista (monto de venta)',tot.monto,null,'#01216A'],
          ['− Descuento '+RS.descPct+'%',-tot.descuento,null,'#B11425'],
          ['− Costo mercadería (MB '+((tot.monto>0?(tot.monto-tot.costo)/tot.monto*100:0).toFixed(1))+'%)',-tot.costo,null,'#B11425'],
          ['− Comisión '+(sinCom?'(sin comisión)':RS.comPct+'%'),-tot.comision,null,sinCom?'#5b6b86':'#B11425'],
          cotizLinea===1?['− IIBB + CyI '+RS.iibbPct+'%',-tot.iibb,null,'#B11425']:null,
          gfPct>0?['− Gastos fijos '+(gfPct*100).toFixed(2)+'%',-tot.gf,null,'#B11425']:null,
          ['− Gastos financieros '+RS.gfFinPct+'%',-tot.gfFin,null,'#B11425'],
          ['= RESULTADO NETO',tot.resultado,mn,colRes],
        ].filter(Boolean).map(([lab,val,pct,col],i,arr)=>{
          const isLast=i===arr.length-1;
          return `<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 12px;
            border-bottom:${isLast?'none':'1px solid #f0f4fa'};
            background:${isLast?bgRes:'#fff'};
            font-weight:${isLast?700:400}">
            <span style="font-size:12.5px;color:${isLast?col:'#0f182b'}">${lab}</span>
            <span style="font-family:Oswald,sans-serif;font-size:13px;font-weight:700;color:${col}">
              ${val<0?'−':''}$${fmtARS(Math.abs(val))}
              ${pct!=null?`<span style="font-size:11px;font-weight:600"> (${pct.toFixed(2)}%)</span>`:''}
            </span>
          </div>`;
        }).join('')}
      </div>
    </div>

    ${rows.length>1?`
    <!-- Detalle por ítem -->
    <div style="font-size:11px;font-weight:700;color:#5b6b86;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Detalle por ítem</div>
    <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px">
      <thead><tr style="border-bottom:2px solid #01216A">
        <th style="text-align:left;padding:6px 8px;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:#5b6b86">Ítem</th>
        <th style="text-align:right;padding:6px 8px;font-size:10.5px;color:#5b6b86">Lista</th>
        <th style="text-align:right;padding:6px 8px;font-size:10.5px;color:#5b6b86">Cobrado</th>
        <th style="text-align:right;padding:6px 8px;font-size:10.5px;color:#5b6b86">MB%</th>
        <th style="text-align:right;padding:6px 8px;font-size:10.5px;color:#5b6b86">Resultado</th>
        <th style="text-align:right;padding:6px 8px;font-size:10.5px;color:#5b6b86">%neto</th>
      </tr></thead>
      <tbody>${rows.map((r,i)=>{
        const mn=r.monto>0?r.resultado/r.monto*100:0;
        return `<tr style="border-bottom:1px solid #f0f4fa;background:${i%2?'#f9fafd':'#fff'}">
          <td style="padding:7px 8px;font-weight:600">${r.desc}</td>
          <td style="padding:7px 8px;text-align:right;font-family:Oswald,sans-serif">$${fmtARS(r.monto)}</td>
          <td style="padding:7px 8px;text-align:right;font-family:Oswald,sans-serif;color:#01216A">$${fmtARS(r.cobrado)}</td>
          <td style="padding:7px 8px;text-align:right;font-family:Oswald,sans-serif;color:#E0982B">${r.mb.toFixed(1)}%</td>
          <td style="padding:7px 8px;text-align:right;font-family:Oswald,sans-serif;font-weight:700;color:${r.resultado>=0?'#1f8a5b':'#B11425'}">$${fmtARS(r.resultado)}</td>
          <td style="padding:7px 8px;text-align:right;font-weight:700;color:${mn>=0?'#1f8a5b':'#B11425'}">${mn.toFixed(1)}%</td>
        </tr>`;}).join('')}
      </tbody>
    </table></div>`:''}`;
  }

  // Wire
  document.getElementById('closeCotiz').onclick=()=>overlay.remove();
  overlay.addEventListener('click',e=>{ if(e.target===overlay) overlay.remove(); });

  document.getElementById('cotiz-add-item').onclick=()=>{
    cotizItems.push({desc:'',monto:0,mb:'',fmt:''});
    renderItems(); calcCotiz();
  };

  overlay.addEventListener('click',e=>{
    if(e.target.classList.contains('cotiz-linea-btn')){
      cotizLinea=+e.target.dataset.l;
      overlay.querySelectorAll('.cotiz-linea-btn').forEach(b=>{
        const active=+b.dataset.l===cotizLinea;
        b.style.background=active?'#01216A':'#fff';
        b.style.color=active?'#fff':'#5b6b86';
        b.style.borderColor=active?'#01216A':'#dde4f5';
      });
      calcCotiz();
    }
  });
  overlay.addEventListener('change',e=>{
    if(e.target.id==='cotiz-vend') calcCotiz();
  });

  renderItems();
  calcCotiz();
}

/* ============ INIT ============ */
buildControls();render();
</script>
</body>
</html>
